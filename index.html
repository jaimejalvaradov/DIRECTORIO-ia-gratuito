<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Directorio de IAs Gratuitas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { color: #7c5cff; font-size: 2rem; }
    p { font-size: 1.1rem; max-width: 500px; }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #7c5cff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background-color: #6a4de0; }
  </style>
</head>
<body>
  <h1>🤖 Directorio de IAs Gratuitas</h1>
  <p>Este programa se maneja desde la <strong>consola del navegador</strong>.</p>
  <p>Apretá <strong>F12</strong> y abrí la pestaña "Console" antes de iniciar.</p>
  <button onclick="iniciarPrograma()">▶️ Iniciar programa</button>

  <script src="script.js"></script>
</body>
</html>
