<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Directorio de IAs Gratuitas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #7c5cff; text-align: center; font-size: 1.5rem; }
    .item {
      background-color: #2a2a40;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .item input { width: 22px; height: 22px; }
    .item .info { flex: 1; }
    .item .nombre { font-weight: bold; }
    .item .detalle { font-size: 0.85rem; color: #bbbbbb; }
    .item .precio { color: #7c5cff; font-weight: bold; }
    #resumen {
      background-color: #2a2a40;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }
    #total { font-size: 1.3rem; color: #7c5cff; font-weight: bold; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 1rem;
      background-color: #7c5cff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🤖 Directorio de IAs Gratuitas</h1>
  <div id="lista"></div>

  <div id="resumen">
    <div id="seleccionadas">Ninguna IA seleccionada</div>
    <div id="total">Total premium: $0.00/mes</div>
    <button onclick="abrirSeleccionadas()">🚀 Abrir seleccionadas</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
